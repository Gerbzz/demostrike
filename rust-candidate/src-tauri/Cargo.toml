[package]
name = "demostrike-rust-candidate"
version = "0.1.0"
edition = "2024"
publish = false

[features]
synthetic-import-smoke = []

[lib]
name = "demostrike_rust_candidate"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
demostrike = { path = "../..", features = ["offline-filmcraft"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-plugin-dialog = "2"

[build-dependencies]
tauri-build = { version = "2" }

[dev-dependencies]
tempfile = "3"
